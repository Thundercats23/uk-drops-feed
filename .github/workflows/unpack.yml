name: unpack-bundle
on:
  push:
    paths: ['bundle.tar.gz']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar -xzf bundle.tar.gz
          git rm -q bundle.tar.gz .github/workflows/unpack.yml
          git config user.name "Thundercats23"
          git config user.email "Thundercats23@users.noreply.github.com"
          git add -A
          git commit -m "v0.8.0: card credit packs (GBP, Stripe), OpenAPI and tutorial updates"
          git push
